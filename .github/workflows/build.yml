name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          python3 - <<'EOF'
          import zipfile, os
          z = zipfile.ZipFile('FischMacro.zip')
          for i in z.infolist():
              name = i.filename.replace('\\', '/')
              if name.endswith('/'):
                  continue
              p = os.path.join('proj', name)
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'wb').write(z.read(i))
          EOF
          find proj -type f | head -50
          S=$(find proj -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then echo "settings.gradle.kts NOT FOUND inside the zip"; exit 1; fi
          D=$(dirname "$S")
          if [ "$D" != "proj" ]; then mv "$D" project; else mv proj project; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "sdkmanager at: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.5" }
      - name: Build
        run: gradle assembleDebug
        working-directory: project
      - uses: actions/upload-artifact@v4
        with:
          name: FischMacro-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
