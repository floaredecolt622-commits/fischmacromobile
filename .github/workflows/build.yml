name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List repo files
        run: ls -la
      - name: Extract project
        run: |
          python3 - <<'EOF'
          import zipfile, os, glob, sys
          zips = glob.glob('*.zip')
          print('zip files found:', zips)
          if not zips:
              sys.exit('NO ZIP FILE in the repo root. The zip upload did not work.')
          z = zipfile.ZipFile(zips[0])
          for i in z.infolist():
              if i.is_dir():
                  continue
              p = os.path.join('proj', i.filename.replace('\\', '/'))
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'wb').write(z.read(i))
          EOF
          find proj -type f | head -50
          S=$(find proj -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then echo "settings.gradle.kts NOT FOUND inside the zip"; exit 1; fi
          mv "$(dirname "$S")" project
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.5" }
      - name: Build
        run: gradle assembleDebug
        working-directory: project
      - uses: actions/upload-artifact@v4
        with:
          name: FischMacro-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
