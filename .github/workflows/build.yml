name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          python3 - <<'EOF'
          import zipfile, os
          z = zipfile.ZipFile('FischMacro.zip')
          for i in z.infolist():
              if i.is_dir():
                  continue
              p = os.path.join('proj', i.filename.replace('\\', '/'))
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'wb').write(z.read(i))
          EOF
          mv "$(dirname "$(find proj -name settings.gradle.kts | head -1)")" project
          ls -R project | head -50
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.5" }
      - name: Build
        run: gradle assembleDebug
        working-directory: project
      - uses: actions/upload-artifact@v4
        with:
          name: FischMacro-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
